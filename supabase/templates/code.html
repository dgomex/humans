<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #0c1014;">
  <h2 style="font-size: 20px; margin: 0 0 16px;">Humans</h2>
  <p style="font-size: 14px; line-height: 20px; margin: 0 0 16px;">
    Someone tried to sign up or log in to Humans with {{ .Email }}. If this was you, enter this code in the app:
  </p>
  <p style="font-size: 32px; letter-spacing: 6px; font-weight: 700; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="font-size: 12px; line-height: 16px; color: #737373; margin: 0;">
    This code expires in 10 minutes. If you didn't request it, you can ignore this email.
  </p>
</div>
